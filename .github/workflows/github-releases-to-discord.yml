name: Releases to Discord

# Posts every published GitHub Release (title + notes) to a Discord channel.
# Needs the repository secret WEBHOOK_URL (Discord channel webhook URL).
on:
  release:
    types: [published]
  # Manual test: Actions tab > "Releases to Discord" > Run workflow
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release title (test only)"
        required: true
        default: "Test release"
      release_body:
        description: "Release notes (test only)"
        required: true
        default: "Test message from the workflow."
      release_html_url:
        description: "Release URL (test only)"
        required: false
        default: "https://github.com/Vithor14/Steambirds-Alliance-Revive/releases"

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Steambirds Revive"
          footer_title: "Changelog"
          reduce_headings: true
          # Uncomment to ping the channel on each release:
          # content: "@everyone"
          release_name: ${{ inputs.release_name }}
          release_body: ${{ inputs.release_body }}
          release_html_url: ${{ inputs.release_html_url }}
