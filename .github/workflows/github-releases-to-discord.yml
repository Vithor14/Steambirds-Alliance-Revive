name: Releases to Discord

# Posts every published GitHub Release (title + notes) to a Discord channel.
# Needs the repository secret WEBHOOK_URL (Discord channel webhook URL).
on:
  release:
    types: [published]
  # Manual re-send: Actions tab > "Releases to Discord" > Run workflow > type the release tag.
  # (A text box cannot hold line breaks, so the notes are read from the release itself.)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to send again (example: 0.5.0)"
        required: true

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Load release (manual run only)
        if: github.event_name == 'workflow_dispatch'
        id: manual
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url > release.json
          {
            echo "name=$(jq -r '.name' release.json)"
            echo "url=$(jq -r '.url' release.json)"
            echo "body<<RELEASE_BODY_EOF"
            jq -r '.body' release.json
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Steambirds Revive"
          footer_title: "Changelog"
          reduce_headings: true
          # Uncomment to ping the channel on each release:
          # content: "@everyone"
          # Only filled on manual runs; on a real release the action reads the release itself.
          release_name: ${{ steps.manual.outputs.name }}
          release_body: ${{ steps.manual.outputs.body }}
          release_html_url: ${{ steps.manual.outputs.url }}
